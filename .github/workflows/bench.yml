name: Benchmark CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-benchmarks:
    name: Test Benchmark Runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Upstream Workload Manifest
        run: python fetch_upstream.py

      - name: Run Benchmark Verification (Node.js TurboFan & Jitless)
        run: python runner.py --type runtimes --iterations 2 --warmup 1

      - name: Check Generated Report Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "results/latest.json")) { throw "Missing results/latest.json" }
          if (-not (Test-Path "results/summary.md")) { throw "Missing results/summary.md" }
          if (-not (Test-Path "report.html")) { throw "Missing report.html" }

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            results/
            report.html
